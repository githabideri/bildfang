name: Build

# GitHub-hosted runners ship an Android SDK with licenses pre-accepted, so
# AGP auto-provisions platforms/build-tools. The ARCore artifact
# (com.google.ar:core) resolves from Google's Maven repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bildfang-debug
          path: app/build/outputs/apk/debug/bildfang-debug.apk

  release:
    # Signed release on version tags (v*): the keystore is stored as a repo
    # secret (BUILD_FANG_KEYSTORE_B64) and the key.properties as RELEASE_PROPS.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        run: |
          echo "${{ secrets.BILD_FANG_KEYSTORE_B64 }}" | base64 -d > release-keystore.jks
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
            > key.properties
          chmod 600 release-keystore.jks key.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon \
          -PstoreFile=release-keystore.jks -PstoreProps=key.properties

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bildfang-release
          path: app/build/outputs/apk/release/bildfang-release.apk
